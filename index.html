<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shrek's Big Day</title>
<!-- Private lesson tool: shows the teacher's own pictures from ders_gorselleri/ and the narrator clips in ders_sesleri.js. Do not publish. -->
<script src="ders_sesleri.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;overflow:hidden;user-select:none;color:#2d2a4a;background:#7cbf55}
/* 100dvh = the part of the screen the browser really shows (iPhone Safari's toolbar is not counted) */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#stage{flex:1;position:relative;overflow:hidden;background:#5b7a3a}
/* swamp picture behind everything, softened a little so the cards and characters stand out */
#stage::before{content:"";position:absolute;inset:-12px;background:url("ders_gorselleri/arka_plan_bataklik.webp") center/cover no-repeat;filter:blur(2px) brightness(1.08) saturate(1.1)}
#stage.field{background:repeating-linear-gradient(90deg,#4caf50 0 8%,#43a047 8% 16%)}
#stage.field::before{display:none}
/* phones and tablets held upright get the tall version of the swamp picture */
@media (orientation:portrait) and (max-width:900px){
  #stage::before{background-image:url("ders_gorselleri/arka_plan_bataklik_dikey.webp");background-position:center 40%;filter:blur(1.5px) brightness(1.2) saturate(1.1)}
}
.emo{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;line-height:1;display:inline-block}
.hidden{display:none!important}

/* speech bubble: the question as text, read aloud by the narrator */
#bubble{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:12;background:#fff;border-radius:24px;padding:10px 22px;font-size:30px;font-weight:700;box-shadow:0 5px 12px rgba(0,0,0,.15);max-width:70vw;text-align:center;display:flex;align-items:center;gap:12px}
#bubble:empty{display:none}
#bubble{border:4px solid #fff;transition:border-color .2s}
#bubble.talk{border-color:#ff9800}
#replay{position:absolute;top:14px;left:16px;z-index:12;width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#ff9800;font-size:36px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
#nextBtn{position:absolute;right:22px;bottom:18px;z-index:45;width:100px;height:100px;border-radius:50%;border:6px solid #fff;background:#7c4dff;font-size:50px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2);animation:pulse 1.2s infinite}

/* scoreboard (match only) */
#score{position:absolute;top:12px;right:14px;z-index:40;display:flex;align-items:center;gap:10px;background:#0b1f4d;border:4px solid #ffd400;border-radius:16px;padding:4px 14px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
#score .team{font:800 18px "Segoe UI",system-ui,sans-serif;color:#ffd400}
#score .pts{font:900 38px "Segoe UI",system-ui,sans-serif;color:#fff;min-width:30px;text-align:center}
#score .pts.bump{animation:popin .5s}

/* map */
#map{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.5vh;padding:70px 0 12px}
.stations{display:grid;grid-template-columns:repeat(3,1fr);gap:5vh 3vw}
.st{position:relative;width:22vw;max-width:280px;height:min(24vh,220px);border-radius:28px;border:6px solid #fff;background:var(--c);cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.18);display:flex;align-items:flex-end;justify-content:center;animation:popin .4s both;transition:transform .15s}
.st:hover{transform:scale(1.05) rotate(-1deg)}
/* every card picture sits in the same centred box, above the name label */
.st .pic{position:absolute;inset:9% 9% 22% 9%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.st .pic img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.st .pic .emo{font-size:min(14vh,130px);filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.st .nm{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:3px 14px;font-weight:700;font-size:20px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.st .num{position:absolute;top:-14px;left:-14px;width:48px;height:48px;border-radius:50%;background:#1e3a8a;color:#fff;border:4px solid #fff;font:800 24px "Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.st .star{position:absolute;top:-20px;right:-16px;font-size:56px;animation:popin .5s both}
.bigbtn{border:none;border-radius:40px;padding:12px 34px;font:700 30px "Comic Sans MS",system-ui,sans-serif;background:#ff7043;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}

/* question area */
#q{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:100px 3vw 2vh}
.row{display:flex;gap:2.5vw;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.opt{background:#fffdf0;border:6px solid #fff;border-radius:28px;min-width:15vw;height:28vh;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.15);transition:transform .15s,opacity .3s;animation:popin .4s both;padding:1vh 1vw;position:relative}
.opt:hover{transform:translateY(-6px) scale(1.04)}
.opt img{height:100%;max-width:20vw;object-fit:contain}
.opt .emo{font-size:14vh}
.opt.right{background:#d7f8d4;box-shadow:0 0 0 8px #43a047}
.opt.wrong{animation:shake .45s;opacity:.4}
.opt.show{box-shadow:0 0 0 8px #fdd835;animation:pulse 1s infinite}
.opt.blank{background:rgba(255,255,255,.35);border-style:dashed;cursor:default}
.group{display:flex;flex-wrap:wrap;gap:4px;max-width:14vw;justify-content:center}
.group img{height:7vh}
.vis{height:42vh;display:flex;align-items:flex-end;justify-content:center}
.vis img{height:100%;max-width:92vw;object-fit:contain;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25))}
.vis .emo{font-size:28vh}
.cue{font-size:60px}
.mic{animation:pulse 1s infinite}
.thumbs{display:flex;gap:5vw}
.thumb{font-size:100px;width:170px;height:170px;border-radius:50%;border:6px solid #fff;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.18)}
.thumb.up{background:#a5d6a7}.thumb.down{background:#ef9a9a}
.thumb.right{box-shadow:0 0 0 8px #43a047}.thumb.wrong{opacity:.4;animation:shake .45s}.thumb.show{box-shadow:0 0 0 8px #fdd835;animation:pulse 1s infinite}
.reveal{position:relative;height:44vh;display:inline-block}
.reveal img{height:100%;display:block}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.tile{background:#8e24aa;border:3px solid #fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;transition:opacity .4s,transform .4s}
.tile:nth-child(odd){background:#fb8c00}
.tile.off{opacity:0;transform:scale(.3);pointer-events:none}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:2vh 2vw}
.card{width:14vw;max-width:170px;height:22vh;perspective:600px;cursor:pointer}
.card .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:20px;border:5px solid #fff;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.card .f{background:#43a047;font-size:70px;color:#fff}
.card .b{background:#fffdf0;transform:rotateY(180deg)}
.card .b .emo{font-size:12vh}
.card .b img{max-width:85%;max-height:85%;object-fit:contain}
.card.done .b{background:#d7f8d4}
.flyer img{height:100%}
.flyer{position:fixed;z-index:50;pointer-events:none;transition:transform .8s cubic-bezier(.3,.1,.3,1),opacity .3s .7s}
.react{position:fixed;font-size:110px;animation:floatup 1.6s forwards;pointer-events:none;z-index:40}
.curtain{position:absolute;inset:0;z-index:15;background:#3949ab;display:flex;align-items:center;justify-content:center;animation:fadein .3s}
.curtain .emo{font-size:200px;animation:pulse 1s infinite}

/* match */
.overlay{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2vh;animation:fadein .25s}
.pen{background:repeating-linear-gradient(90deg,#4caf50 0 8%,#43a047 8% 16%)}
.goal{position:relative;width:54vw;height:38vh;border:14px solid #fff;border-bottom:none;border-radius:6px 6px 0 0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.35) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 2px,transparent 2px 22px),rgba(0,0,0,.08)}
.keeper{position:absolute;bottom:-2vh;left:50%;height:32vh;object-fit:contain;object-position:bottom;transform:translateX(-50%);transition:transform .45s cubic-bezier(.3,.1,.3,1)}
.goaltxt.glove{font-size:80px;-webkit-text-stroke:0}
/* "what's missing": the 4 foods with the gap on one row, the 4 choices on a separate row below */
#mrow,#mchoices{flex-wrap:nowrap;gap:1.5vw}
#mchoices{margin-top:1vh}
.msep{font-size:44px;line-height:1;margin:1vh 0;border-top:4px dashed rgba(255,255,255,.85);width:70vw;padding-top:1vh;text-align:center}
.pball{font-size:100px;transition:transform .55s cubic-bezier(.2,.6,.3,1)}
.shooter{position:absolute;bottom:2vh;height:36vh;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.goaltxt{position:absolute;font:900 140px "Comic Sans MS",system-ui,sans-serif;color:#ffd400;-webkit-text-stroke:6px #0b1f4d;animation:popin .5s both;z-index:3}
.wheelwrap{position:relative;width:62vh;height:62vh}
.wheel{width:100%;height:100%;border-radius:50%;border:10px solid #fff;box-shadow:0 10px 0 rgba(0,0,0,.2);position:relative;transition:transform 3.2s cubic-bezier(.15,.7,.2,1)}
.wheel .seg{position:absolute;left:50%;top:50%;width:0;height:0}
.wheel .seg span{position:absolute;transform:translate(-50%,-50%);font-size:9vh}
.wheel .seg img{position:absolute;height:13vh;transform:translate(-50%,-50%)}
.pointer{position:absolute;top:-4vh;left:50%;transform:translateX(-50%);font-size:9vh;z-index:2}
.big{position:absolute;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.big .emo{font-size:260px;animation:popin .6s both}

/* teacher bar */
#bar{background:#1f2937;color:#e5e7eb;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px calc(6px + env(safe-area-inset-bottom));font:14px "Segoe UI",system-ui,sans-serif;min-height:52px}
#bar .info{flex:1;min-width:260px;line-height:1.3}
#bar .info b{color:#fde68a}
#bar .lbl{color:#9ca3af;font-size:12px}
.tb{background:#374151;color:#fff;border:none;border-radius:8px;padding:7px 11px;font:600 14px "Segoe UI",system-ui,sans-serif;cursor:pointer}
.tb:hover{filter:brightness(1.2)}
.tb.ok{background:#16a34a}.tb.help{background:#ca8a04}.tb.no{background:#dc2626}.tb.on{background:#2563eb}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",system-ui,sans-serif}
.modal .card2{background:#fff;border-radius:14px;padding:18px 22px;width:min(720px,94vw);max-height:88vh;overflow:auto;user-select:text}
.modal table{width:100%;border-collapse:collapse;font-size:14px}
.modal td{padding:4px 6px;border-bottom:1px solid #eee}
.modal textarea{width:100%;min-height:150px;font:14px "Segoe UI",system-ui,sans-serif;margin-top:8px}
.confetti{position:fixed;top:-20px;width:14px;height:20px;z-index:80;pointer-events:none;animation:fall linear forwards}

.feedrow{align-items:center;gap:4vw}

/* ---------- tablets (portrait) and phones ---------- */
@media (max-width:900px){
  #bubble{left:84px;right:12px;transform:none;max-width:none;font-size:22px;padding:8px 14px;justify-content:center}
  #replay{width:60px;height:60px;font-size:28px}
  #nextBtn{width:76px;height:76px;font-size:36px;right:12px;bottom:12px}
  .stations{grid-template-columns:repeat(2,1fr);gap:4.5vh 5vw}
  .st{width:40vw;max-width:320px;height:min(17vh,190px)}
  .st .nm{font-size:16px;bottom:-14px}
  .st .num{width:38px;height:38px;font-size:19px;top:-12px;left:-12px}
  .st .star{font-size:40px}
  .bigbtn{font-size:22px;padding:10px 26px}
  /* question bubble stays on top; cards and pictures sit in the middle of the space below it */
  #q{gap:2.2vh;padding-left:3vw;padding-right:3vw;padding-bottom:3vh;justify-content:center}
  .opt .group{max-width:100%;gap:2px}
  /* "what's missing": 4 food cards above, 4 choices below, all smaller */
  #mrow .opt,#mchoices .opt{width:21vw;height:11vh;padding:.6vh;border-width:4px;border-radius:16px}
  #mrow,#mchoices{gap:2vw}
  .msep{font-size:32px;width:86vw}
  /* the bubble always keeps room for two lines, so pictures do not jump when the text gets shorter */
  #bubble{min-height:86px}
  .st{height:min(15vh,170px)}
  /* match: score at the very top, question bubble just below it */
  #stage.field #score{top:8px;bottom:auto;left:50%;right:auto;transform:translateX(-50%)}
  #stage.field #bubble,#stage.field #replay{top:62px}
  #stage.field .vis{height:20vh}
  #stage.field .opt{height:15vh}
  #stage.field .thumb{width:90px;height:90px;font-size:50px}
  .row{gap:3vw}
  .opt{min-width:0;width:42vw;height:19vh;border-radius:22px;padding:1vh}
  .opt img{max-width:100%}
  .opt .emo{font-size:10vh}
  .vis{height:30vh}
  .vis .emo{font-size:20vh}
  .thumb{width:110px;height:110px;font-size:64px}
  .reveal{height:32vh}
  .tile{font-size:28px}
  .mem{gap:1.5vh 2vw}
  .card{width:21vw;height:14vh}
  .card .f{font-size:44px}
  .feedrow{flex-direction:column;gap:1.5vh}
  .feedrow .vis{height:22vh}
  .feedrow .row .opt{width:42vw;height:15vh}
  .group img{height:4.6vh}
  .goal{width:88vw;height:30vh;border-width:9px}
  .keeper{height:24vh}
  .shooter{height:20vh}
  .pball{font-size:64px}
  .goaltxt{font-size:72px;-webkit-text-stroke:4px #0b1f4d}
  .wheelwrap{width:min(84vw,56vh);height:min(84vw,56vh)}
  .wheel .seg img{height:9vh}
  .big .emo{font-size:160px}
  .curtain .emo{font-size:120px}
  #score{top:auto;bottom:12px;right:auto;left:12px;padding:3px 10px;gap:6px}
  #score .team{font-size:13px}
  #score .pts{font-size:28px;min-width:22px}
  /* teacher buttons: big 3x2 grid; the page already ends above the browser toolbar, so no extra space below */
  #bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 8px calc(8px + env(safe-area-inset-bottom));font-size:12px}
  #bar .info{grid-column:1/-1;min-width:0}
  .tb{padding:11px 4px;font-size:14px;border-radius:10px}
  .tb.fsbtn{display:none}
}
/* shorter upright phones (e.g. iPhone Safari with its toolbars): a picture + choices must still fit below the bubble */
@media (max-width:900px) and (orientation:portrait) and (max-height:760px){
  .vis{height:24vh}
  .reveal{height:25vh}
  .opt{height:16vh}
  .feedrow .vis{height:19vh}
  .feedrow .row .opt{height:13vh}
  .thumb{width:96px;height:96px;font-size:54px}
  #q{gap:1.6vh}
}
/* phones in landscape: little height, so everything gets shorter */
@media (max-height:520px){
  #bubble{font-size:18px;padding:5px 12px;top:8px;min-height:0}
  #replay{width:48px;height:48px;font-size:22px;top:8px}
  #nextBtn{width:62px;height:62px;font-size:28px}
  #map{padding:52px 0 6px;gap:2.5vh}
  .stations{grid-template-columns:repeat(3,1fr);gap:4.5vh 3vw}
  .st{width:22vw;height:19vh}
  .st .nm{font-size:13px;bottom:-12px;padding:1px 10px}
  .st .num{width:30px;height:30px;font-size:16px}
  .st .star{font-size:30px}
  .bigbtn{font-size:17px;padding:5px 18px}
  .opt{width:auto;min-width:18vw;height:28vh}
  .vis{height:30vh}
  .feedrow{flex-direction:row}
  .feedrow .row .opt{width:auto;height:24vh}
  .card{width:12vw;height:22vh}
  .reveal{height:38vh}
  .thumb{width:90px;height:90px;font-size:50px}
  #bar .info{min-width:200px}
  #bar{grid-template-columns:repeat(6,1fr);padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .tb{padding:7px 4px;font-size:12px}
  /* landscape match: score top-right next to the bubble instead of above it */
  #stage.field #score{top:8px;left:auto;right:10px;transform:none}
  #stage.field #bubble,#stage.field #replay{top:8px}
  #stage.field #bubble{right:200px}
  #stage.field .vis{height:30vh}
  #stage.field .opt{height:26vh}
}

@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes popin{from{transform:scale(0);opacity:0}70%{transform:scale(1.12)}to{transform:scale(1);opacity:1}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
@keyframes floatup{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:translateY(-200px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes fadein{from{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="bubble"></div>
    <button id="replay" class="emo hidden" title="Tekrar dinle">🔊</button>
    <div id="score" class="hidden"><span class="team">EMİR</span><span class="pts" id="ptE">0</span><span class="team">–</span><span class="pts" id="ptS">0</span><span class="team" style="color:#b6e36b">SHREK</span></div>
    <div id="map"></div>
    <div id="q" class="hidden"></div>
    <button id="nextBtn" class="emo hidden" title="Sonraki">➡️</button>
  </div>
  <div id="bar"></div>
</div>

<script>
/* ---------- assets: the teacher's own pictures + emoji objects ---------- */
const NAME = "Emir";
const IMG = n => `ders_gorselleri/${n}.png`;
const C = {shrek: "img:shrek_02_ozguvenli", fiona: "img:fiona", donkey: "img:esek_1_gulumsuyor", puss: "img:kedi_selam"};
// food: the teacher's photos; objects and faces: Microsoft Fluent Emoji 3D (MIT licence). Swap a file to change a picture.
const F = {pasta: "img:yiyecek_pasta", salad: "img:yiyecek_salad", rice: "img:yiyecek_rice", cake: "img:yiyecek_cake",
  soup: "img:yiyecek_soup", water: "img:yiyecek_water", icecream: "img:yiyecek_icecream", socks: "img:nesne_socks", onion: "img:nesne_onion"};
const FOODS = ["pasta", "salad", "rice", "cake", "soup", "water", "icecream"];
const someFoods = (n, must) => shuffle([...(must ? [must] : []), ...shuffle(FOODS.filter(f => f !== must)).slice(0, n - (must ? 1 : 0))]);
const FACE = {happy: "img:yuz_happy", angry: "img:yuz_angry", sad: "img:yuz_sad"};
const V = v => v.startsWith("img:") ? `<img src="${IMG(v.slice(4))}" alt="">` : `<span class="emo">${v}</span>`;
const pick = (map, ids) => ids.map(id => [id, map[id]]);
const group = (e, n) => `grp|${e}|${n}`;

/* ---------- spoken lines (tools/build_shrek_audio.py records every say/model/fix/intro/say2 string and PH) ---------- */
const PH = {
  praise: ["Great job!", "Well done, {name}!", "Super!", "Yes! Excellent!"],
  oops: "Oops! Try again!",
  look: "Look! This one!",
  yuck: "Yuck! Try again!",
  sayIt: "Say it with me!",
  goalEmir: "Goal! {name} scores!",
  saveShrek: "Oh no! Shrek catches the ball!",
  win: "{name} wins! You are a superstar!",
  lose: "Shrek wins this time! Let's play again!",
  draw: "It's a draw! Great game!",
  star: "Hooray! You got a star!",
  pickIsland: "Hello, {name}! Where shall we go?",
  spin: "Say stop!",
  words: {pasta: "Pasta!", salad: "Salad!", rice: "Rice!", cake: "Cake!", soup: "Soup!", water: "Water!", icecream: "Ice cream!"},
};

/* ---------- question bank: Super Safari 1 Unit 7 (Food) + review ----------
   t: tap | feel | count | speak | tf | learn | feed | missing | odd | memory | reveal
   say: the narrator's question; model: said after a right answer */
const STATIONS = [
  {id: "morning", name: "Good morning!", color: "#ffb74d", icon: "img:shrek_00_uzanmis", intro: "Good morning! Shrek is waking up!", qs: [

/* ---------- narrator voice: pre-recorded clips (same child voice as Bobo) ---------- */
const AUDIO = window.SHREK_AUDIO || {};
let actx, token = 0, src = null;
function ctx() { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); return actx; }
document.addEventListener("pointerdown", () => { try { ctx(); } catch (e) {} }, true);
const bufs = {};
async function buf(k) {
  if (!bufs[k]) {
    const bin = atob(AUDIO[k]), b = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    const ab = await new Promise((ok, no) => ctx().decodeAudioData(b.buffer, ok, no));
    const d = ab.getChannelData(0), sr = ab.sampleRate; let s = 0, e = d.length - 1;
    while (s < e && Math.abs(d[s]) < .012) s++;
    while (e > s && Math.abs(d[e]) < .012) e--;
    bufs[k] = {ab, off: Math.max(0, s / sr - .03), dur: (e - s) / sr + .09};
  }
  return bufs[k];
}
function clipKeys(text) {   // must match tools/build_shrek_audio.py
  const parts = text.split("{name}"), out = [];
  parts.forEach((seg, i) => { if (/[A-Za-z]/.test(seg)) out.push("en:" + seg.trim()); if (i < parts.length - 1) out.push("nm:" + NAME); });
  return out;
}
async function playKey(k, my) {
  if (my !== token || !AUDIO[k]) return;
  const x = await buf(k);
  if (my !== token) return;
  const n = ctx().createBufferSource(); n.buffer = x.ab; n.connect(ctx().destination); src = n;
  await new Promise(r => { n.onended = r; n.start(0, x.off, x.dur); setTimeout(r, (x.dur + .6) * 1000); });
}
function stopVoice() { token++; if (src) { try { src.stop(); } catch (e) {} src = null; } $("bubble").classList.remove("talk"); }
let lastSaid = [];
async function say(lines, show = true) {
  stopVoice(); const my = token;
  lines = [].concat(lines).filter(Boolean);
  if (show) { lastSaid = lines; }
  for (const line of lines) {
    if (my !== token) return;
    if (show) { $("bubble").textContent = line.replace(/\{name\}/g, NAME); $("bubble").classList.add("talk"); fitBubble(); }
    for (const k of clipKeys(line)) await playKey(k, my);
    await new Promise(r => setTimeout(r, 250));
  }
  if (my === token) $("bubble").classList.remove("talk");
}

/* ---------- sound effects ---------- */
function tone(f, t0, d, type = "sine", v = .12) {
  try {
    const c = ctx(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const sfx = {
  pop: () => tone(620, 0, .1, "square", .04),
  ding: n => tone(440 * Math.pow(2, (n || 0) / 6), 0, .3),
  yes: () => { tone(784, 0, .15); tone(1175, .12, .3); },
  oops: () => { tone(330, 0, .18, "triangle"); tone(262, .15, .3, "triangle"); },
  yuck: () => { tone(220, 0, .25, "sawtooth", .05); tone(160, .18, .35, "sawtooth", .05); },
  whoosh: () => { for (let i = 0; i < 6; i++) tone(300 + i * 90, i * .04, .08, "triangle", .05); },
  cheer: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .1, .35, "triangle")),
  whistle: () => { tone(2200, 0, .25, "sine", .07); tone(2200, .32, .6, "sine", .07); },
  // a soft crowd "aww": many voices sliding gently down, filtered so it sounds round, not scary
  aww: () => {
    try {
      const c = ctx(), t = c.currentTime, out = c.createGain(), vowel = c.createBiquadFilter(), soft = c.createBiquadFilter();
      vowel.type = "bandpass"; vowel.frequency.value = 750; vowel.Q.value = 1.2;
      soft.type = "lowpass"; soft.frequency.value = 1500;
      out.gain.setValueAtTime(.0001, t); out.gain.exponentialRampToValueAtTime(.5, t + .12); out.gain.exponentialRampToValueAtTime(.0001, t + 1.4);
      vowel.connect(soft); soft.connect(out); out.connect(c.destination);
      for (let i = 0; i < 9; i++) {   // nine "voices", each a little different
        const o = c.createOscillator(), g = c.createGain(), f = 280 * Math.pow(2, (Math.random() * 7) / 12), start = t + Math.random() * .08;
        o.type = "sawtooth";
        o.frequency.setValueAtTime(f * 1.15, start); o.frequency.exponentialRampToValueAtTime(f * .72, start + 1.25);
        o.detune.value = (Math.random() - .5) * 30;
        g.gain.value = .06;
        o.connect(g); g.connect(vowel); o.start(start); o.stop(t + 1.45);
      }
    } catch (e) {}
  },
};

  }
  if (Q.t === "feed") opts.forEach(o => o.onclick = () => feed(o, Q));
  if (Q.t === "missing") $("closeEyes").onclick = () => hideOne(Q);
  if (Q.t === "memory") memory();
}

function choose(el, ok) {
  if (cur.solved || cur.resolved) return;
  cur.tries++;
  if (ok) { el.classList.add("right"); correct(); return; }
  el.classList.add("wrong"); sfx.oops();
  if (STATIONS[cur.si].match) { resolveMatch(false); return; }   // in the match a wrong answer is a goal for Shrek
  if (cur.tries >= 2) { showAnswer(); say([PH.look, q().model]); } else say([PH.oops, q().say]);
}
function showAnswer() {
  const Q = q(); cur.hinted = true;
  if (Q.t === "tf") document.querySelector(`.thumb[data-tf="${Q.ans ? 1 : 0}"]`)?.classList.add("show");
  else document.querySelector(`#q .opt[data-id="${Q.ans}"]`)?.classList.add("show");
}
function hint() {
  if (q().t === "reveal") document.querySelectorAll(".tile:not(.off)").forEach((t, i) => i < 3 && t.classList.add("off"));
  showAnswer();
  if (q().t === "speak") say([PH.sayIt, q().model]);
}
function record(m) { if (!S.results[rkey()]) { S.results[rkey()] = m; save(); } }
function teacherMark(m) {
  if (m === "no") {
    record("no");
    if (STATIONS[cur.si].match) { resolveMatch(false); return; }
    showAnswer(); sfx.oops(); say([PH.look, PH.sayIt, q().model]);
    $("nextBtn").classList.remove("hidden");
    return;
  }
  if (cur.solved) { S.results[rkey()] = m; save(); return; }
  cur.hinted = cur.hinted || m === "help";
  correct();
}
function correct() {
  if (cur.solved) return;
  cur.solved = true;
  record(cur.tries <= 1 && !cur.hinted ? "ok" : "help");
  sfx.yes();
  if (STATIONS[cur.si].match) { resolveMatch(true); return; }
  confetti(30);
  say([rand(PH.praise), q().model]);
  $("nextBtn").classList.remove("hidden");
}

/* ---------- the match: Emir takes a penalty after every answer, Shrek keeps goal ----------
   right answer (alone or with help) -> Shrek dives the wrong way, goal for Emir
   wrong answer -> Shrek catches the ball, a point for Shrek */
function resolveMatch(emirScores) {
  if (cur.resolved) return;
  cur.resolved = true;
  setTimeout(() => {
    const o = document.createElement("div");
    o.className = "overlay pen";
    o.innerHTML = `<div class="goal"><img class="keeper" id="pkeeper" src="${IMG("shrek_04_cok_mutlu")}" alt=""></div>
      <img class="shooter" style="left:3vw" src="${IMG("esek_2_zipliyor")}" alt="">
      <div class="pball emo" id="pball">⚽</div>`;
    $("stage").appendChild(o);
    const spots = [[-18, -34], [18, -34], [-12, -24], [12, -24]];
    const [x, y] = rand(spots);
    setTimeout(() => {
      sfx.whoosh();
      if (emirScores) {
        $("pball").style.transform = `translate(${x}vw, ${y}vh) scale(.55)`;
        $("pkeeper").style.transform = `translateX(calc(-50% + ${-Math.sign(x) * 15}vw)) rotate(${-Math.sign(x) * 25}deg)`;
      } else {   // Shrek dives to the ball and the ball stops in his raised hands
        const kr = $("pkeeper").getBoundingClientRect(), br = $("pball").getBoundingClientRect();
        const shift = x * .7 * innerWidth / 100;
        const dx = kr.left + kr.width / 2 + shift - (br.left + br.width / 2), dy = kr.top + kr.height * .2 - (br.top + br.height / 2);
        $("pkeeper").style.transform = `translateX(calc(-50% + ${x * .7}vw)) rotate(${Math.sign(x) * 8}deg)`;
        $("pball").style.transform = `translate(${dx}px, ${dy}px) scale(.5)`;
      }
    }, 400);
    setTimeout(() => {
      const who = emirScores ? "emir" : "shrek";
      match[who]++;
      const p = $(emirScores ? "ptE" : "ptS"); p.textContent = match[who]; p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump");
      const g = document.createElement("div"); g.className = "goaltxt";
      // GOAL! sits on the upper part of the net, above the keeper
      const gl = o.querySelector(".goal"); g.style.cssText = `top:${gl.offsetTop + 6}px;left:0;right:0;text-align:center`;
      if (emirScores) {
        g.textContent = "GOAL!";
        // the annoyed picture gets exactly the box the keeper picture had, so both look the same size
        const k = $("pkeeper"); k.style.width = k.offsetWidth + "px"; k.style.height = k.offsetHeight + "px";
        k.src = IMG("shrek_10_cani_sikkin");
        sfx.cheer(); confetti(70); say([PH.goalEmir, q().model]);
      } else {
        g.className = "goaltxt glove"; g.innerHTML = `<span class="emo">🧤</span>`;
        g.style.top = gl.offsetTop + gl.offsetHeight + innerHeight * .035 + "px";   // the free grass just below the goal
        sfx.aww(); sadFaces(); say([PH.saveShrek, PH.look, q().model]);
      }
      o.appendChild(g);
      $("nextBtn").classList.remove("hidden");
    }, 1000);
  }, 500);
}

function nextQ() {
  stopVoice();
  const s = STATIONS[cur.si];
  if (cur.qi < s.qs.length - 1) { cur.qi++; renderQ(false); return; }
  if (!S.done.includes(s.id)) { S.done.push(s.id); save(); }
  closeOverlays(); $("nextBtn").classList.add("hidden");
  const o = document.createElement("div");
  o.className = "big";
  if (s.match) {
    sfx.whistle();
    const res = match.emir > match.shrek ? "win" : match.emir < match.shrek ? "lose" : "draw";
    o.innerHTML = `<span class="emo">${res === "win" ? "🏆" : res === "draw" ? "🤝" : "⚽"}</span>`;
    setTimeout(() => { if (res !== "lose") confetti(140); sfx.cheer(); say(PH[res]); }, 900);
  } else {
    o.innerHTML = `<span class="emo">⭐</span>`;
    confetti(80); sfx.cheer(); say(PH.star);
  }
  $("stage").appendChild(o);
  o.onclick = () => showMap(true);
  $("nextBtn").classList.remove("hidden");
}

/* ---------- special question types ---------- */
function feed(el, Q) {
  if (cur.solved || cur.resolved) return;
  const ok = el.dataset.id === Q.ans, E = EATERS[Q.who], eater = $("eater");
  const from = el.getBoundingClientRect(), to = eater.getBoundingClientRect();
  const fly = document.createElement("div");
  fly.className = "flyer"; fly.innerHTML = V(F[el.dataset.id]);
  fly.style.cssText = `left:${from.left}px;top:${from.top}px;height:${from.height}px`;
  document.body.appendChild(fly); sfx.whoosh();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fly.style.transform = `translate(${to.left + to.width * .3 - from.left}px,${to.top + to.height * .2 - from.top}px) scale(.5)`;
    fly.style.opacity = "0";
  }));
  setTimeout(() => {
    fly.remove();
    eater.src = IMG(ok ? (Q.ans === "pasta" && E.pasta) || E.like : E.no);
    const r = document.createElement("div");
    r.className = "react emo"; r.textContent = ok ? "❤️" : "🤢";
    r.style.left = to.left + to.width * .6 + "px"; r.style.top = to.top + "px";
    document.body.appendChild(r); setTimeout(() => r.remove(), 1700);
    if (ok) { el.classList.add("right"); correct(); }
    else {
      el.classList.add("wrong"); sfx.yuck(); cur.tries++;
      if (cur.tries >= 2) { showAnswer(); say([PH.look, Q.say]); } else say([PH.yuck, Q.say]);
      setTimeout(() => { if (!cur.solved) eater.src = IMG(E.hungry); }, 1500);
    }
  }, 820);
}

function hideOne(Q) {
  const c = document.createElement("div");
  c.className = "curtain"; c.innerHTML = `<span class="emo">🙈</span>`;
  $("stage").appendChild(c); sfx.whoosh();
  const gone = rand(Q.opts)[0];
  Q.ans = gone;
  setTimeout(() => {
    c.remove();
    $("mrow").innerHTML = Q.opts.map(([id, v]) => id === gone ? `<div class="opt blank"><span class="emo" style="font-size:12vh">❓</span></div>` : `<div class="opt" style="cursor:default">${V(v)}</div>`).join("");
    $("closeEyes").outerHTML = `<div class="msep emo">👇</div><div class="row" id="mchoices">${shuffle(Q.opts).map(([id, v]) => `<div class="opt" data-id="${id}">${V(v)}</div>`).join("")}</div>`;
    document.querySelectorAll("#mchoices .opt").forEach(o => o.onclick = () => choose(o, o.dataset.id === gone));
    const i = document.querySelector("#bar .info"); if (i) i.innerHTML += ` · Cevap: <b>${gone}</b>`;
    say(Q.say2);
  }, 2400);
}

function memory() {
  let open = [], matched = 0;
  const cards = [...document.querySelectorAll(".card")];
  cards.forEach(c => c.onclick = () => {
    if (c.classList.contains("flip") || open.length === 2) return;
    c.classList.add("flip"); sfx.pop(); open.push(c);
    if (open.length === 2) {
      const [a, b] = open;
      if (a.dataset.id === b.dataset.id) {
        setTimeout(() => {
          a.classList.add("done"); b.classList.add("done"); sfx.ding(matched * 3); say(PH.words[a.dataset.id]); open = []; matched++;
          if (matched === cards.length / 2) setTimeout(correct, 900);
        }, 450);
      } else setTimeout(() => { a.classList.remove("flip"); b.classList.remove("flip"); open = []; }, 1100);
    }
  });
}

/* ---------- teacher bar & notes ---------- */
function tb(label, fn, cls) { const b = document.createElement("button"); b.className = "tb" + (cls ? " " + cls : ""); b.textContent = label; b.onclick = fn; return b; }
function bar(info, buttons) {
  const b = $("bar"); b.innerHTML = info;
  [...buttons, tb("⛶", () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}), "fsbtn")].forEach(x => b.appendChild(x));
}
const MARK = {ok: "✅ Kendisi", help: "🟡 Yardımla", no: "❌ Bilmedi"};
function showNotes() {
  const rows = STATIONS.flatMap(s => s.qs.map((Q, i) => { const m = S.results[`${s.id}:${i}`]; return m ? `<tr><td>${s.name}</td><td>${Q.label}</td><td>${MARK[m]}</td></tr>` : ""; })).join("");
  const weak = STATIONS.flatMap(s => s.qs.map((Q, i) => ["help", "no"].includes(S.results[`${s.id}:${i}`]) ? `• ${s.name}: ${Q.label}` : null)).filter(Boolean);
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="card2"><h3 style="margin-top:0">📋 Ders notları (sadece öğretmen)</h3>
    <table>${rows || "<tr><td>Henüz cevap yok.</td></tr>"}</table>
    <b style="display:block;margin-top:12px">Tekrar edilecekler</b><textarea>${weak.join("\n")}</textarea>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="tb no" id="nReset">Sıfırla (notlar ve yıldızlar)</button><span style="flex:1"></span><button class="tb on" id="nClose">Kapat</button></div></div>`;
  document.body.appendChild(m);
  $("nClose").onclick = () => m.remove();
  $("nReset").onclick = () => { if (!confirm("Her şey sıfırlansın mı?")) return; S.results = {}; S.done = []; save(); m.remove(); showMap(); };
}

$("replay").onclick = () => say(lastSaid);
$("nextBtn").onclick = () => { const big = document.querySelector(".big"); big ? showMap(true) : nextQ(); };
document.addEventListener("keydown", e => {
  if (document.querySelector(".modal")) return;
  const k = e.key.toLowerCase();
  if (!cur) return;
  if (k === "1") teacherMark("ok"); else if (k === "2") teacherMark("help"); else if (k === "3") teacherMark("no");
  else if (k === "h") hint(); else if (k === " ") { e.preventDefault(); say(lastSaid); }
  else if (k === "arrowright" || k === "enter") $("nextBtn").click(); else if (k === "m") showMap();
});

/* the question area always starts below the speech bubble, so a long question never covers the activity */
function fitBubble() {
  const b = $("bubble"), q = $("q");
  const pad = (b.textContent ? b.offsetTop + b.offsetHeight + 12 : 20) + "px";
  q.style.paddingTop = pad;
  $("map").style.paddingTop = b.textContent ? pad : "";   // map cards start below the greeting too
  fitContent();
}
/* on any screen size: if the activity is taller than the space between bubble and buttons, shrink it to fit */
function fitContent() {
  const q = $("q"), kids = [...q.children];
  if (q.classList.contains("hidden") || !kids.length) return;
  kids.forEach(c => c.style.zoom = "");
  const cs = getComputedStyle(q), gap = parseFloat(cs.rowGap) || 0;
  const avail = q.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const need = kids.reduce((s, c) => s + c.offsetHeight, 0) + gap * (kids.length - 1);
  if (need > avail) kids.forEach(c => c.style.zoom = Math.max(.45, avail / need));
}
window.addEventListener("resize", fitBubble);
// re-fit whenever the question area or the button bar changes size, and when pictures finish loading
if (window.ResizeObserver) { const ro = new ResizeObserver(() => fitContent()); ro.observe($("q")); ro.observe($("bar")); }
document.addEventListener("load", e => { if (e.target.tagName === "IMG" && e.target.closest("#q")) fitContent(); }, true);

showMap();
if (!window.SHREK_AUDIO) $("bubble").textContent = "⚠️ ders_sesleri.js bulunamadı – ses kapalı";
</script>
